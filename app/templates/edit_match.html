{% extends "base.html" %}
{% block title %}Edit Match{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
  <i class="fa fa-pen-to-square text-accent text-xl"></i> Edit Match
</h1>

<div class="max-w-lg mx-auto">
  <div class="card">
    <div class="card-head"><i class="fa fa-pen-to-square"></i> Match Details</div>
    <div class="p-5 flex flex-col gap-5">
      {% if error %}
      <div class="flash flash-err"><i class="fa fa-circle-xmark"></i> {{ error }}</div>
      {% endif %}

      <form method="post" class="flex flex-col gap-5">
        <div>
          <label class="lbl"><i class="fa fa-calendar fa-xs"></i> Date</label>
          <input type="date" class="inp" name="match_date"
                 value="{{ match.match_date.isoformat() }}" required>
        </div>

        <!-- Players -->
        <div class="grid grid-cols-[1fr_40px_1fr] gap-3 items-end">
          <div>
            <label class="lbl">Player 1</label>
            <select class="inp" name="player1_id" required>
              {% for p in players %}
              <option value="{{ p.id }}" {% if p.id == match.player1_id %}selected{% endif %}>
                {{ p.name }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="text-center text-slate-500 font-bold text-sm pb-2.5">VS</div>
          <div>
            <label class="lbl">Player 2</label>
            <select class="inp" name="player2_id" required>
              {% for p in players %}
              <option value="{{ p.id }}" {% if p.id == match.player2_id %}selected{% endif %}>
                {{ p.name }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Scores -->
        <div class="grid grid-cols-[1fr_40px_1fr] gap-3 items-end">
          <div>
            <label class="lbl">Score P1</label>
            <input type="number" class="inp text-center text-xl font-bold"
                   name="score1" min="0" value="{{ match.score1 }}" required>
          </div>
          <div class="text-center text-slate-600 font-bold pb-2.5">—</div>
          <div>
            <label class="lbl">Score P2</label>
            <input type="number" class="inp text-center text-xl font-bold"
                   name="score2" min="0" value="{{ match.score2 }}" required>
          </div>
        </div>

        <button type="submit" class="btn-green">
          <i class="fa fa-floppy-disk"></i> Save Changes
        </button>
      </form>

      <div class="border-t border-white/[0.07] pt-4">
        <form method="post" action="{{ url_for('main.delete_match', match_id=match.id) }}"
              onsubmit="return confirm('Are you sure you want to delete this match? Ratings will be recalculated.')">
          <button type="submit"
                  class="w-full flex items-center justify-center gap-2 py-2 px-4 rounded-lg
                         border border-red-500/20 text-red-400 text-sm font-medium
                         hover:bg-red-500/10 hover:border-red-500/40 transition-all">
            <i class="fa fa-trash"></i> Delete Match
          </button>
        </form>
      </div>

      <div class="text-center">
        <a href="{{ url_for('main.matches') }}" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
          <i class="fa fa-arrow-left"></i> Back to History
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

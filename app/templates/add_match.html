{% extends "base.html" %}
{% block title %}Add Match{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
  <i class="fa fa-futbol text-accent text-xl"></i> Record a Match
</h1>

<div class="max-w-lg mx-auto">
  <div class="card">
    <div class="card-head"><i class="fa fa-pen-to-square"></i> Match Details</div>
    <div class="p-5 flex flex-col gap-5">
      {% if error %}
      <div class="flash flash-err"><i class="fa fa-circle-xmark"></i> {{ error }}</div>
      {% endif %}

      {% if players | length < 2 %}
      <div class="flash flash-wrn">
        <i class="fa fa-triangle-exclamation mt-0.5"></i>
        <span>Need at least 2 players. <a href="{{ url_for('main.players') }}" class="underline underline-offset-2">Add players first.</a></span>
      </div>
      {% else %}
      <form method="post" class="flex flex-col gap-5">
        <div>
          <label class="lbl"><i class="fa fa-calendar fa-xs"></i> Date</label>
          <input type="date" class="inp" name="match_date" value="{{ today }}" required>
        </div>

        <!-- Players -->
        <div class="grid grid-cols-[1fr_40px_1fr] gap-3 items-end">
          <div>
            <label class="lbl">Player 1</label>
            <select class="inp" name="player1_id" required>
              {% for p in players %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
            </select>
          </div>
          <div class="text-center text-slate-500 font-bold text-sm pb-2.5">VS</div>
          <div>
            <label class="lbl">Player 2</label>
            <select class="inp" name="player2_id" required>
              {% for p in players %}
              <option value="{{ p.id }}" {% if loop.index == 2 %}selected{% endif %}>{{ p.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Scores -->
        <div class="grid grid-cols-[1fr_40px_1fr] gap-3 items-end">
          <div>
            <label class="lbl">Score P1</label>
            <input type="number" class="inp text-center text-xl font-bold" name="score1" min="0" value="0" required>
          </div>
          <div class="text-center text-slate-600 font-bold pb-2.5">—</div>
          <div>
            <label class="lbl">Score P2</label>
            <input type="number" class="inp text-center text-xl font-bold" name="score2" min="0" value="0" required>
          </div>
        </div>

        <button type="submit" class="btn-green">
          <i class="fa fa-floppy-disk"></i> Save Match
        </button>
      </form>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}

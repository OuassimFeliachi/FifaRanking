{% extends "base.html" %}
{% block title %}Add Match{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white fw-bold">Record a Match</div>
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if players | length < 2 %}
        <div class="alert alert-warning">
          You need at least 2 players to record a match.
          <a href="{{ url_for('main.players') }}">Add players first.</a>
        </div>
        {% else %}
        <form method="post">
          <div class="mb-3">
            <label for="match_date" class="form-label">Date</label>
            <input type="date" class="form-control" id="match_date" name="match_date"
                   value="{{ today }}" required>
          </div>

          <div class="row g-3 align-items-end mb-3">
            <div class="col-5">
              <label class="form-label">Player 1</label>
              <select class="form-select" name="player1_id" required>
                {% for p in players %}
                <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-2 text-center">
              <span class="fs-5 fw-bold">vs</span>
            </div>
            <div class="col-5">
              <label class="form-label">Player 2</label>
              <select class="form-select" name="player2_id" required>
                {% for p in players %}
                <option value="{{ p.id }}" {% if loop.index == 2 %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label">Score Player 1</label>
              <input type="number" class="form-control" name="score1" min="0" value="0" required>
            </div>
            <div class="col-6">
              <label class="form-label">Score Player 2</label>
              <input type="number" class="form-control" name="score2" min="0" value="0" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100">Save Match</button>
        </form>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
